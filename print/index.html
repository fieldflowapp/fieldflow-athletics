<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldFlow Athletics · Event Print · NEO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#17232b;--muted:#66727a;--line:#d7dde1;--navy:#071d2d}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef2f4}
.bar{max-width:1100px;margin:14px auto;display:flex;gap:10px;align-items:center;padding:0 14px}
.bar select,.bar button{padding:10px 12px;border:1px solid #b9c3c9;border-radius:8px;background:white;font:inherit}
.bar button{background:var(--navy);color:white;font-weight:700;cursor:pointer}
.bar .spacer{flex:1}
.field-table{table-layout:auto}.field-table th,.field-table td{padding:5px 4px}.field-table .attempt-col{min-width:42px}
.event-page{break-after:page;page-break-after:always}.event-page:last-child{break-after:auto;page-break-after:auto}.report-banner{font-size:12px;margin:0 0 8px;color:#66727a}.sheet{width:210mm;min-height:297mm;margin:10px auto 30px;background:white;padding:12mm;box-shadow:0 8px 30px #0002}
.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:8px}
h1{font-size:22px;margin:0}.meta{font-size:12px;color:var(--muted);margin-top:4px}.record{font-size:12px;text-align:right}
h2{font-size:14px;margin:18px 0 7px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left}
th{background:#f2f5f7;font-size:10px;text-transform:uppercase}
.center{text-align:center}.right{text-align:right}.strong{font-weight:700}
.heat{break-inside:avoid;margin-bottom:12px}
.finalbox{border:2px solid var(--navy);padding:8px;margin-top:8px;break-inside:avoid}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
.footer{margin-top:18px;padding-top:7px;border-top:1px solid var(--line);font-size:9px;color:var(--muted);display:flex;justify-content:space-between}
.login{max-width:380px;margin:15vh auto;background:white;padding:22px;border-radius:12px;box-shadow:0 8px 30px #0002}
.login input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccd4d9;border-radius:8px}.login button{width:100%;padding:10px;background:var(--navy);color:white;border:0;border-radius:8px;font-weight:700}
.hidden{display:none!important}
@page{size:A4 portrait;margin:8mm}
@media print{
 body{background:white}.bar,.login{display:none!important}.sheet{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}
 h2{margin-top:12px}.footer{position:relative}
}
@media(max-width:900px){.sheet{width:100%;min-height:0;margin:0;padding:14px;box-shadow:none}.bar{margin:8px auto}.head{flex-direction:column}.record{text-align:left}}
</style>

  <link rel="manifest" href="../manifest.webmanifest?v=45">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FieldFlow Athletics">
<link rel="stylesheet" href="../assets/neo.css?v=45" media="screen"></head>
<body data-neo="print">
<div id="login" class="login hidden">
  <h2 style="margin-top:0">Admin sign in</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="signIn">Sign in</button>
  <div id="loginMsg" class="meta" style="margin-top:8px"></div>
</div>
<div id="main" class="hidden">
  <div class="bar">
    <select id="categoryFilter" aria-label="Category"><option value="All">All categories</option></select>
    <select id="genderFilter" aria-label="Gender"><option value="All">Boys &amp; Girls</option><option value="F">Girls</option><option value="M">Boys</option></select>
    <select id="eventSelect"></select>
    <button id="loadBtn">Load event</button>
    <button id="reportBtn">Full report</button>
    <div class="spacer"></div>
    <button onclick="window.print()">Print / Save PDF</button>
  </div>
  <main class="sheet" id="sheet"></main>
</div>
<script>
const SUPABASE_URL='https://qhsvvlcgwdmxxappplzh.supabase.co';
const SUPABASE_KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO';
const TOURNAMENT_ID='204a8f52-5525-4077-85e4-1d3811d68323';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const gender=g=>g==='F'?'Girls':'Boys';
function usesClockFormat(e){
  return ['400M','600M','800M','4X100','5X80','8X50','4X400'].includes(e?.code)||e?.discipline==='relay';
}
function fmtTime(v,e){
  if(v==null||v==='')return '—';
  const n=Number(v);
  if(usesClockFormat(e)){
    const min=Math.floor(n/60);
    const sec=n-(min*60);
    return min+':'+sec.toFixed(2).padStart(5,'0');
  }
  return n.toFixed(2)+' s';
}
function perf(v,u,e){
  if(v==null)return '—';
  return u==='s'?fmtTime(v,e):Number(v).toFixed(2)+' '+(u||'');
}
function eventTitle(e){return e.category+' · '+gender(e.gender)+' · '+e.name;}
function fieldMark(v){return v==null||v===''?'—':Number(v).toFixed(2)+' m';}
function fieldStatus(x){if(!x)return '—';if(x.status==='valid')return fieldMark(x.mark_m);return ({foul:'X',pass:'–',pending:'—'})[x.status]||x.status||'—';}
function hjResult(x){return ({clear:'O',miss:'X',pass:'–'})[x?.result]||'—';}
let allEvents=[];
const CATEGORY_ORDER=['Y5','Y6','Y7','Y8','Intermediate','Senior'];
function reportEventOrder(events){
  const groupOrder=new Map();
  events.forEach(e=>{
    const key=e.category+'|'+e.discipline+'|'+(e.code||e.name);
    const n=Number(e.sort_order);
    groupOrder.set(key,Math.min(groupOrder.get(key)??Infinity,Number.isFinite(n)?n:9999));
  });
  const categoryRank=c=>{const i=CATEGORY_ORDER.indexOf(c);return i<0?999:i;};
  const groupKey=e=>e.category+'|'+e.discipline+'|'+(e.code||e.name);
  return [...events].sort((a,b)=>
    categoryRank(a.category)-categoryRank(b.category)||
    a.category.localeCompare(b.category)||
    groupOrder.get(groupKey(a))-groupOrder.get(groupKey(b))||
    (a.code||a.name).localeCompare(b.code||b.name,undefined,{numeric:true})||
    (a.discipline||'').localeCompare(b.discipline||'')||
    (a.gender==='F'?0:a.gender==='M'?1:2)-(b.gender==='F'?0:b.gender==='M'?1:2)
  );
}
function filteredEvents(){return reportEventOrder(allEvents.filter(e=>($('categoryFilter').value==='All'||e.category===$('categoryFilter').value)&&($('genderFilter').value==='All'||e.gender===$('genderFilter').value)));}
function filterEvents(){let events=filteredEvents();$('eventSelect').innerHTML=events.map(e=>'<option value="'+esc(e.id)+'">'+esc(eventTitle(e))+'</option>').join('');}
async function buildFullReport(){
  const events=filteredEvents();if(!events.length){$('sheet').innerHTML='<div class="empty">No events for these filters.</div>';return;}
  const btn=$('reportBtn'),load=$('loadBtn');btn.disabled=true;load.disabled=true;
  const pages=[];let failures=0;
  for(let i=0;i<events.length;i++){
    $('sheet').innerHTML='<div class="empty">Building report '+(i+1)+' / '+events.length+' · '+esc(eventTitle(events[i]))+'</div>';
    try{
      await loadEvent(events[i].id);
      const html=$('sheet').innerHTML;
      if(html.includes('class="empty">')&&!html.includes('class="head"'))failures++;
      pages.push('<section class="event-page">'+html+'</section>');
    }catch(err){failures++;pages.push('<section class="event-page"><h2>'+esc(eventTitle(events[i]))+'</h2><p>Unable to load: '+esc(err.message)+'</p></section>');}
  }
  $('sheet').innerHTML='<div class="report-banner">Official competition report · '+events.length+' events · '+new Date().toLocaleString()+(failures?' · '+failures+' require review':'')+'</div>'+pages.join('');
  btn.disabled=false;load.disabled=false;
}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').classList.remove('hidden');return}
  $('main').classList.remove('hidden');
  const {data:events,error}=await sb.from('athletics_events').select('*').eq('tournament_id',TOURNAMENT_ID).in('discipline',['track','relay','field']).order('category').order('gender').order('sort_order');
  if(error){$('sheet').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
  allEvents=events||[];
  $('categoryFilter').innerHTML='<option value="All">All categories</option>'+[...new Set(allEvents.map(e=>e.category))].sort((a,b)=>({Y5:5,Y6:6,Y7:7,Y8:8,Intermediate:9,Senior:10}[a]||99)-({Y5:5,Y6:6,Y7:7,Y8:8,Intermediate:9,Senior:10}[b]||99)).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  $('categoryFilter').onchange=filterEvents;$('genderFilter').onchange=filterEvents;filterEvents();
  $('reportBtn').onclick=buildFullReport;
  const q=new URLSearchParams(location.search).get('event');
  if(q && allEvents.some(e=>e.id===q)){const ev=allEvents.find(e=>e.id===q);$('categoryFilter').value=ev.category;$('genderFilter').value=ev.gender;filterEvents();$('eventSelect').value=q;}
  $('loadBtn').onclick=()=>{history.replaceState(null,'','?event='+encodeURIComponent($('eventSelect').value));loadEvent($('eventSelect').value)};
  if($('eventSelect').value) loadEvent($('eventSelect').value);
}
async function loadEvent(eventId){
  $('sheet').innerHTML='<div class="empty">Loading event…</div>';
  const [{data:event,error:eErr},{data:heats,error:hErr},{data:regs,error:rErr},{data:entries,error:enErr},{data:ledger,error:lErr},{data:relayResults,error:rrErr},{data:relayTeams,error:rtErr}]=await Promise.all([
    sb.from('athletics_events').select('*').eq('id',eventId).single(),
    sb.from('athletics_track_heats').select('*').eq('event_id',eventId).order('stage').order('heat_number'),
    sb.from('athletics_registrations').select('*').eq('event_id',eventId),
    sb.from('athletics_track_entries').select('*').eq('tournament_id',TOURNAMENT_ID),
    sb.from('athletics_points_ledger').select('*').eq('event_id',eventId).order('place'),
    sb.from('athletics_relay_results').select('*').eq('event_id',eventId).order('lane'),
    sb.from('athletics_relay_teams').select('*').eq('event_id',eventId)
  ]);
  const err=eErr||hErr||rErr||enErr||lErr||rrErr||rtErr;if(err){$('sheet').innerHTML='<div class="empty">'+esc(err.message)+'</div>';return}
  if(event.discipline==='field'){await renderFieldEvent(event,regs||[],ledger||[]);return;}
  const athleteIds=[...new Set((regs||[]).map(r=>r.athlete_id))];
  let athletes=[];
  if(athleteIds.length){
    const {data,error}=await sb.from('athletics_athletes').select('*').in('id',athleteIds);
    if(error){$('sheet').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
    athletes=data||[];
  }
  const aBy=new Map(athletes.map(a=>[a.id,a]));
  const rBy=new Map((regs||[]).map(r=>[r.id,r]));
  const heatIds=new Set((heats||[]).map(h=>h.id));
  const evEntries=(entries||[]).filter(x=>heatIds.has(x.heat_id));
  const entryRows=(heatId)=>evEntries.filter(x=>x.heat_id===heatId).sort((a,b)=>(a.lane??999)-(b.lane??999));
  const athleteForEntry=(en)=>{const r=rBy.get(en.registration_id);return r?aBy.get(r.athlete_id):null};
  const record=event.record_value?('<b>Record:</b> '+esc(event.record_value)+(event.record_year?' · '+esc(event.record_year):'')):'<b>Record:</b> —';
  let out='<header class="head"><div><h1>FieldFlow Athletics</h1><div class="meta">'+esc(eventTitle(event))+'</div></div><div class="record">'+record+'</div></header>';
  out+='<h2>Event summary</h2><table><tbody><tr><th>Category</th><td>'+esc(event.category)+'</td><th>Gender</th><td>'+esc(gender(event.gender))+'</td></tr><tr><th>Event</th><td>'+esc(event.name)+'</td><th>Code</th><td>'+esc(event.code)+'</td></tr><tr><th>Registered</th><td>'+esc((regs||[]).filter(r=>r.status==='registered').length)+'</td><th>Finalists</th><td>'+esc(event.has_final?(event.finalists_count||8):'No final')+'</td></tr></tbody></table>';

  if(event.discipline==='relay'){
    const teamBy=new Map((relayTeams||[]).map(t=>[t.id,t]));
    out+='<h2>Relay final</h2><div class="finalbox">';
    if(!(relayResults||[]).length){
      out+='<div class="empty">No relay results available yet.</div>';
    }else{
      out+='<table><thead><tr><th class="center">Lane</th><th>Colour</th><th>Status</th><th class="right">Time</th></tr></thead><tbody>';
      (relayResults||[]).forEach(rr=>{
        const team=teamBy.get(rr.relay_team_id)||{};
        out+='<tr><td class="center">'+esc(rr.lane??'—')+'</td><td>'+esc(team.color||'')+'</td><td>'+esc(rr.status||'')+'</td><td class="right">'+esc(fmtTime(rr.official_time,event))+'</td></tr>';
      });
      out+='</tbody></table>';
    }
    out+='</div>';
  }else{
    const heatList=(heats||[]).filter(h=>h.stage==='heat');
    out+='<h2>Heats</h2>';
    if(!heatList.length) out+='<div class="empty">No heats generated.</div>';
    heatList.forEach(h=>{
      const rows=entryRows(h.id);
      out+='<section class="heat"><div class="strong" style="margin-bottom:5px">Heat '+esc(h.heat_number)+' · '+esc(h.status)+'</div><table><thead><tr><th class="center">Lane</th><th>Athlete</th><th>Colour</th><th>Status</th><th class="right">Time</th></tr></thead><tbody>';
      rows.forEach(en=>{const a=athleteForEntry(en)||{};out+='<tr><td class="center">'+esc(en.lane??'—')+'</td><td>'+esc((a.last_name||'')+', '+(a.first_name||''))+'</td><td>'+esc(a.color||'')+'</td><td>'+esc(en.status||'')+'</td><td class="right">'+esc(fmtTime(en.official_time,event))+'</td></tr>'});
      out+='</tbody></table></section>';
    });

    const finalHeat=(heats||[]).find(h=>h.stage==='final');
    out+='<h2>Final</h2><div class="finalbox">';
    if(!finalHeat){out+='<div class="empty">Final not created yet.</div>'}
    else{
      const rows=entryRows(finalHeat.id);
      out+='<table><thead><tr><th class="center">Lane</th><th>Athlete</th><th>Colour</th><th>Status</th><th class="right">Final time</th></tr></thead><tbody>';
      rows.forEach(en=>{const a=athleteForEntry(en)||{};out+='<tr><td class="center">'+esc(en.lane??'—')+'</td><td>'+esc((a.last_name||'')+', '+(a.first_name||''))+'</td><td>'+esc(a.color||'')+'</td><td>'+esc(en.status||'')+'</td><td class="right">'+esc(fmtTime(en.official_time,event))+'</td></tr>'});
      out+='</tbody></table>';
    }
    out+='</div>';
  }

  out+='<h2>Official places & points</h2>';
  if(!(ledger||[]).length) out+='<div class="empty">No official ranking available yet.</div>';
  else{
    out+='<table><thead><tr><th class="center">Place</th><th>Athlete</th><th>Colour</th><th class="right">Performance</th><th class="center">Points</th></tr></thead><tbody>';
    (ledger||[]).forEach(x=>{out+='<tr><td class="center strong">'+esc(x.place)+'</td><td>'+esc(x.last_name+', '+x.first_name)+'</td><td>'+esc(x.color)+'</td><td class="right">'+esc(perf(x.performance_numeric,x.performance_unit,event))+'</td><td class="center strong">'+esc(Number(x.points))+'</td></tr>'});
    out+='</tbody></table>';
  }
  out+='<div class="footer"><span>FieldFlow Athletics</span><span>Printed '+esc(new Date().toLocaleString())+'</span></div>';
  $('sheet').innerHTML=out;
}

async function renderFieldEvent(event,regs,ledger){
  const isHighJump=event.code==='HJ';
  const requests=[
    sb.from('athletics_athletes').select('*').eq('tournament_id',TOURNAMENT_ID).eq('level',event.category).eq('gender',event.gender),
    isHighJump?sb.from('athletics_high_jump_heights').select('*').eq('event_id',event.id).order('sequence_no'):sb.from('athletics_field_attempts').select('*').eq('event_id',event.id).order('attempt_no'),
    isHighJump?sb.from('athletics_high_jump_attempts').select('*').eq('event_id',event.id):sb.from('athletics_field_measured_ranking').select('*').eq('event_id',event.id).order('place'),
    isHighJump?sb.from('athletics_high_jump_ranking').select('*').eq('event_id',event.id).order('place'):Promise.resolve({data:[]})
  ];
  const [ar,details,extra,ranking]=await Promise.all(requests);
  const err=ar.error||details.error||extra.error||ranking.error;
  if(err){$('sheet').innerHTML='<div class="empty">'+esc(err.message)+'</div>';return}
  const athletes=new Map((ar.data||[]).map(a=>[a.id,a]));
  const registered=regs.filter(r=>r.status==='registered');
  const ordered=registered.map(r=>({r,a:athletes.get(r.athlete_id)||{}})).sort((x,y)=>String(x.a.last_name||'').localeCompare(String(y.a.last_name||'')));
  const record=event.record_value?esc(event.record_value)+(event.record_year?' · '+esc(event.record_year):''):'—';
  let out='<header class="head"><div><h1>FieldFlow Athletics</h1><div class="meta">'+esc(eventTitle(event))+' · Field</div></div><div class="record"><b>Record:</b> '+record+'</div></header>';
  out+='<h2>Event summary</h2><table><tbody><tr><th>Category</th><td>'+esc(event.category)+'</td><th>Gender</th><td>'+esc(gender(event.gender))+'</td></tr><tr><th>Event</th><td>'+esc(event.name)+'</td><th>Registered</th><td>'+ordered.length+'</td></tr></tbody></table>';
  if(isHighJump){
    const heights=details.data||[], attempts=extra.data||[];
    const byAttempt=new Map(attempts.map(a=>[a.registration_id+'|'+a.height_id+'|'+a.attempt_no,a]));
    out+='<h2>High jump · Height progression</h2>';
    if(!heights.length)out+='<div class="empty">No heights configured yet.</div>';
    else{
      out+='<table class="field-table"><thead><tr><th>Athlete</th><th>Colour</th>'+heights.map(h=>'<th class="center">'+esc(fieldMark(h.height_m))+'</th>').join('')+'</tr></thead><tbody>';
      ordered.forEach(({r,a})=>{
        out+='<tr><td>'+esc((a.last_name||'')+', '+(a.first_name||''))+'</td><td>'+esc(a.color||'')+'</td>';
        heights.forEach(h=>{out+='<td class="center">'+[1,2,3].map(n=>hjResult(byAttempt.get(r.id+'|'+h.id+'|'+n))).filter((v,i,arr)=>v!=='—'||arr.slice(i+1).some(z=>z!=='—')).join(' ')+'</td>'});
        out+='</tr>';
      });
      out+='</tbody></table>';
    }
  }else{
    const attempts=details.data||[], limit=event.attempt_limit||3;
    const byAttempt=new Map(attempts.map(a=>[a.registration_id+'|'+a.attempt_no,a]));
    out+='<h2>Field attempts</h2><table class="field-table"><thead><tr><th>Athlete</th><th>Colour</th>'+Array.from({length:limit},(_,i)=>'<th class="center attempt-col">Attempt '+(i+1)+'</th>').join('')+'</tr></thead><tbody>';
    ordered.forEach(({r,a})=>{
      out+='<tr><td>'+esc((a.last_name||'')+', '+(a.first_name||''))+'</td><td>'+esc(a.color||'')+'</td>';
      for(let n=1;n<=limit;n++)out+='<td class="center">'+esc(fieldStatus(byAttempt.get(r.id+'|'+n)))+'</td>';
      out+='</tr>';
    });
    out+='</tbody></table>';
  }
  out+='<h2>Official places & points</h2>';
  const rank=isHighJump?(ranking.data||[]):(extra.data||[]);
  if(!rank.length)out+='<div class="empty">No official field ranking available yet.</div>';
  else{
    out+='<table><thead><tr><th>Place</th><th>Athlete</th><th>Colour</th><th class="right">Best '+(isHighJump?'height':'mark')+'</th><th class="center">'+(isHighJump?'Total misses':'Second mark')+'</th><th class="center">Points</th></tr></thead><tbody>';
    rank.forEach(x=>{
      out+='<tr><td class="center strong">'+esc(x.place??'—')+'</td><td>'+esc((x.last_name||'')+', '+(x.first_name||''))+'</td><td>'+esc(x.color||'')+'</td><td class="right">'+esc(fieldMark(isHighJump?x.best_height:x.best_mark))+'</td><td class="center">'+esc(isHighJump?(x.total_misses??'—'):fieldMark(x.second_mark))+'</td><td class="center strong">'+esc(x.points??'—')+'</td></tr>';
    });
    out+='</tbody></table>';
  }
  out+='<div class="footer"><span>FieldFlow Athletics · Field</span><span>Printed '+esc(new Date().toLocaleString())+'</span></div>';
  $('sheet').innerHTML=out;
}

$('signIn').onclick=async()=>{
  $('loginMsg').textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){$('loginMsg').textContent=error.message;return}
  $('login').classList.add('hidden');$('main').classList.remove('hidden');init();
};
init();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../service-worker.js?v=25').catch(console.error));}
</script>
