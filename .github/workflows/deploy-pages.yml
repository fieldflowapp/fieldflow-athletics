name: Deploy FieldFlow Athletics

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Class Mode logic
        run: node --test tests/class-logic.test.cjs tests/compare-logic.test.cjs
      - name: Install isolated browser test runtime
        timeout-minutes: 4
        run: |
          npm install --prefix /tmp/ff-browser-runtime --ignore-scripts --fetch-timeout=60000 --fetch-retries=1 playwright@1.56.1
          /tmp/ff-browser-runtime/node_modules/.bin/playwright install --only-shell chromium
      - name: Test desktop and mobile Class Mode
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/ff-browser-runtime/node_modules
        run: |
          node tests/class-browser.cjs
          node tests/compare-browser.cjs
      - name: Save browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-mode-previews
          path: /tmp/class-*
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate version metadata
        shell: bash
        run: |
          printf '{"version":"single-screen","build":"%s","run":%s,"date":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
